                <button
                  type="button"
                  onClick={onOpenAddModal}
                  className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold transition"
                >
                  Create Video Project
                </button>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-800 bg-surface-900/50 text-slate-400 uppercase tracking-wider font-semibold">
                      <th className="py-3.5 pl-6">Video Title & ID</th>
                      <th className="py-3.5">YouTube Link</th>
                      <th className="py-3.5">Languages</th>
                      <th className="py-3.5">Conversions / Parts</th>
                      <th className="py-3.5">Status</th>
                      <th className="py-3.5 text-right pr-6">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {filteredVideos.map(video => {
                      const conversions = video.conversions || [];
                      const runningConv = conversions.find(c => c.status === "processing");
                      const queuedConvs = conversions.filter(c => c.status === "queued");
                      const completedConvs = conversions.filter(c => c.status === "completed");
                      const hasActive = Boolean(runningConv || queuedConvs.length > 0);

                      // Global queue index for this video's first queued item
                      const globalQueueIndex = (queuedJobs || []).findIndex(
                        q => q.video_id === video.id || (q.job_id && queuedConvs.some(c => c.job_id === q.job_id))
                      );
                      const queuePositionLabel = globalQueueIndex >= 0 ? `#${globalQueueIndex + 1} in queue` : "In queue";

                      return (
                        <tr key={video.id} className="hover:bg-surface-850/60 transition">
                          <td className="py-4 pl-6">
                            <div className="font-bold text-slate-100 text-sm">{video.title}</div>
                            <div className="text-[11px] text-slate-500 font-mono mt-0.5">ID: {video.id}</div>
                          </td>

                          <td className="py-4">
                            {video.youtube_url ? (
                              <a
                                href={video.youtube_url}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="text-brand-400 hover:text-brand-300 font-medium inline-flex items-center gap-1 group"
                              >
                                <span className="truncate max-w-[220px]">{video.youtube_url}</span>
                                <Icons.ExternalLink />
                              </a>
                            ) : (
                              <span className="text-emerald-400 font-medium text-xs inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">
                                <span>📁</span>
                                <span className="truncate max-w-[190px]" title={video.source_file_name || "Local Video Upload"}>
                                  {video.source_file_name || "Local Video Upload"}
                                </span>
                              </span>
                            )}
                          </td>

                          <td className="py-4">
                            <div className="flex flex-wrap items-center gap-1">
                              {video.languages && video.languages.length > 0 ? (
                                video.languages.map(code => (
                                  <span
                                    key={code}
                                    className="px-2 py-0.5 rounded bg-surface-800 text-slate-300 border border-white/5 font-semibold text-[11px]"
                                  >
                                    {LANG_MAP[code]?.flag} {LANG_MAP[code]?.name || code.toUpperCase()}
                                  </span>
                                ))
                              ) : (
                                <span className="text-slate-500 text-[11px] italic">Not dubbed yet</span>
                              )}
                            </div>
                          </td>

                          <td className="py-4">
                            {conversions.length === 0 ? (
                              <span className="text-slate-500 italic text-[11px]">No parts yet</span>
                            ) : (
                              <div>
                                <span className="font-bold text-slate-200">
                                  {conversions.length} {conversions.length === 1 ? 'Part' : 'Parts'}
                                </span>
                                <div className="text-[10px] text-slate-400 mt-0.5 flex items-center gap-1 flex-wrap">
                                  {runningConv && <span className="text-amber-400 font-semibold">1 converting</span>}
                                  {runningConv && queuedConvs.length > 0 && <span>•</span>}
                                  {queuedConvs.length > 0 && <span className="text-indigo-400 font-semibold">{queuedConvs.length} in queue</span>}
                                  {(runningConv || queuedConvs.length > 0) && completedConvs.length > 0 && <span>•</span>}
                                  {completedConvs.length > 0 && <span className="text-emerald-400">{completedConvs.length} done</span>}
                                </div>
                              </div>
                            )}
                          </td>

                          <td className="py-4">
                            {runningConv ? (
                              <div className="space-y-1">
                                <span className="px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20 font-bold uppercase text-[10px] flex items-center gap-1.5 w-fit animate-pulse">
                                  <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
                                  <span>Converting: {runningConv.part_name || "Part"}</span>
                                </span>
                                <div className="text-[10px] text-slate-400 flex items-center gap-1">
                                  <span className="text-brand-400 font-mono font-bold">{Math.round((runningConv.progress || 0.05) * 100)}%</span>
                                  {queuedConvs.length > 0 && <span className="text-indigo-400 font-semibold">• +{queuedConvs.length} in queue</span>}
                                </div>
                              </div>
                            ) : queuedConvs.length > 0 ? (
                              <div className="space-y-1">
                                <span className="px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-bold uppercase text-[10px] flex items-center gap-1.5 w-fit">
                                  <span>⏳</span>
                                  <span>{queuePositionLabel}</span>
                                </span>
                                <div className="text-[10px] text-slate-400">
                                  {queuedConvs.length} {queuedConvs.length === 1 ? 'part' : 'parts'} waiting in queue
                                </div>
                              </div>
                            ) : (video.status === "completed" || completedConvs.length > 0) ? (
                              <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-bold uppercase text-[10px]">
                                ✓ Completed ({completedConvs.length || conversions.length})
                              </span>
                            ) : (
                              <span className="px-2 py-0.5 rounded-full bg-slate-500/10 text-slate-400 border border-slate-500/20 font-bold uppercase text-[10px]">
                                Draft
                              </span>
                            )}
                          </td>

                          <td className="py-4 text-right pr-6">
                            <div className="flex items-center justify-end gap-2">
                              {hasActive && onCancelJob && (
                                <button
                                  type="button"
                                  onClick={() => {
                                    const activeJobs = conversions.filter(c => c.status === "queued" || c.status === "processing");
                                    if (activeJobs.length === 0) return;
                                    if (window.confirm(`Stop/cancel conversions for "${video.title}"?`)) {
                                      activeJobs.forEach(j => onCancelJob(j.job_id, j.part_name || video.title));
                                    }
                                  }}
                                  className="px-2 py-1.5 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-300 hover:text-white border border-red-500/30 text-xs font-bold transition flex items-center gap-1"
                                  title="Stop/cancel conversions for this video"
                                >
                                  <Icons.Stop />
                                  <span>Stop</span>
                                </button>
                              )}

                              <button
                                type="button"
                                onClick={() => onEditVideo(video)}
                                className="p-1.5 rounded-lg bg-surface-800 hover:bg-surface-700 text-slate-300 hover:text-white transition"
                                title="Edit Title & Link"
                              >
                                <Icons.Edit />
                              </button>

                              <button
                                type="button"
                                onClick={() => onOpenDetails(video.id)}
                                className="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-bold transition flex items-center gap-1 shadow-sm shadow-brand-500/20"
                              >
                                <Icons.Details />
                                <span>Details</span>
                              </button>

                              <button
                                type="button"
                                onClick={() => onDeleteVideo && onDeleteVideo(video.id, video.title)}
                                className="p-1.5 rounded-lg bg-surface-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-white/5 transition"
                                title="Delete Video Project"
                              >
                                <Icons.Trash />
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Video Details View (Contains Current Dubbing Form & Converted Videos Section)
    // =========================================================================
    function VideoDetailsView({ videoId, onBack, onJobCreated, onDeleteVideo, onCancelJob }) {
      const [video, setVideo] = useState(null);
      const [isLoading, setIsLoading] = useState(true);

      const handleDeleteVideoProject = () => {
        if (onDeleteVideo) {
          onDeleteVideo(videoId, video?.title);
        } else {
          const title = video ? video.title : videoId;
          if (window.confirm(`Are you sure you want to delete video project "${title}"? This will permanently delete all associated conversions and files.`)) {
            fetch(`/api/videos/${videoId}`, { method: "DELETE" })
              .then(res => {
                if (res.ok) {
                  onBack && onBack();
                } else {
                  alert("Failed to delete video project");
                }
              })
              .catch(err => alert("Error: " + err.message));
          }
        }
      };

      const handleCancelConversion = async (jobId, partName) => {
        const name = partName || jobId;
        if (!window.confirm(`Are you sure you want to stop/cancel "${name}"?`)) {
          return;
        }
        try {
          const res = await fetch(`/api/jobs/${jobId}/cancel`, { method: "POST" });
          if (res.ok) {
            loadVideo();
            onJobCreated && onJobCreated();
          } else {
            const err = await res.json().catch(() => ({}));
            alert("Failed to cancel job: " + (err.detail || "Server error"));
          }
        } catch (err) {
          alert("Error cancelling job: " + err.message);
        }
      };

      const handleDeleteConversion = async (jobId, partName) => {
        const name = partName || jobId;
        if (window.confirm(`Are you sure you want to delete converted video "${name}"? This will permanently delete its media files.`)) {
          try {
            const res = await fetch(`/api/jobs/${jobId}`, { method: "DELETE" });
            if (res.ok) {
              loadVideo();
              onJobCreated && onJobCreated();
            } else {
              const err = await res.json().catch(() => ({}));
              alert("Failed to delete converted video: " + (err.detail || "Server error"));
            }
          } catch (err) {
            alert("Error deleting conversion: " + err.message);
          }
        }
      };

      // Studio Form State
      const [sourceMode, setSourceMode] = useState("link"); // 'link' or 'upload'
      const [selectedFile, setSelectedFile] = useState(null);
      const [isUploadingSource, setIsUploadingSource] = useState(false);
      const [youtubeUrl, setYoutubeUrl] = useState("");
      const [targetLang, setTargetLang] = useState("es");
      const [isMultiLang, setIsMultiLang] = useState(false);
      const [selectedLangs, setSelectedLangs] = useState(["de", "fr", "id"]);
      const [selectedVoice, setSelectedVoice] = useState("es-ES-AlvaroNeural");
      const [splitMode, setSplitMode] = useState("full"); // 'full' or 'parts'
      const [partDurationMins, setPartDurationMins] = useState(10);
      const [selectedPartIndex, setSelectedPartIndex] = useState(0);
      const [bgVolume, setBgVolume] = useState(0.80);
      const [vocalsVolume, setVocalsVolume] = useState(1.00);
      const [speedCap, setSpeedCap] = useState(1.15);
      const [whisperModel, setWhisperModel] = useState("base");
      const [enableWatermark, setEnableWatermark] = useState(false);
      const [watermarkText, setWatermarkText] = useState("");
      const [geminiApiKey, setGeminiApiKey] = useState("");

      // Active conversion tracking
      const [activeJobId, setActiveJobId] = useState(null);
      const [jobProgress, setJobProgress] = useState(0);
      const [jobStep, setJobStep] = useState("");
      const [jobLogs, setJobLogs] = useState([]);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // SEO Modal State
      const [isSeoModalOpen, setIsSeoModalOpen] = useState(false);
      const [seoPackData, setSeoPackData] = useState(null);
      const [activeSeoLang, setActiveSeoLang] = useState("de");
      const [isFetchingPack, setIsFetchingPack] = useState(false);
      const [copiedField, setCopiedField] = useState(null);

      // Selected parts for batch queuing
      const [selectedPartIndices, setSelectedPartIndices] = useState([]);
      const [batchQueueStatus, setBatchQueueStatus] = useState("");

      // Load Video details from API
      const loadVideo = async () => {
        try {
          const res = await fetch(`/api/videos/${videoId}`);
          if (res.ok) {
            const data = await res.json();
            setVideo(data);
            if (data.source_type === "upload" || data.source_file) {
              setSourceMode("upload");
            } else if (data.youtube_url) {
              setSourceMode("link");
              if (!youtubeUrl) {
                setYoutubeUrl(data.youtube_url);
              }
            } else if (data.youtube_url && !youtubeUrl) {
              setYoutubeUrl(data.youtube_url);
            }
            // Auto fetch duration if not stored
            if (data.youtube_url && (!data.duration_seconds || data.duration_seconds <= 0)) {
              fetch("/api/video-info", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: data.youtube_url })
              })
                .then(r => r.json())
                .then(info => {
                  if (info.duration_seconds) {
                    setVideo(prev => prev ? { ...prev, duration_seconds: info.duration_seconds } : prev);
                  }
                })
                .catch(() => {});
            }
          }
        } catch (e) {
          console.error("Failed to load video details:", e);
        } finally {
          setIsLoading(false);
        }
      };

      const handleSelectUploadFile = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          setSelectedFile(file);
        }
      };

      const handleUploadSourceFile = async (fileOverride) => {
        const target = fileOverride || selectedFile;
        if (!target) return null;
        setIsUploadingSource(true);
        try {
          const formData = new FormData();
          formData.append("file", target);
          const res = await fetch(`/api/videos/${videoId}/upload-source`, {
            method: "POST",
            body: formData
          });
          if (res.ok) {
            const updated = await res.json();
            setVideo(prev => ({ ...prev, ...updated }));
            setSelectedFile(null);
            alert("✓ Video file uploaded successfully! Ready for full or multi-part conversion.");
            onJobCreated && onJobCreated();
            return updated;
          } else {
            const err = await res.json().catch(() => ({}));
            alert("Upload failed: " + (err.detail || "Server error"));
            return null;
          }
        } catch (err) {
          alert("Upload error: " + err.message);
          return null;
        } finally {
          setIsUploadingSource(false);
        }
      };

      useEffect(() => {
        loadVideo();
      }, [videoId]);

      // WebSocket live updates for active job
      useEffect(() => {
        if (!activeJobId) return;

        let ws;
        try {
          const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
          ws = new WebSocket(`${protocol}//${window.location.host}/api/jobs/${activeJobId}/ws`);
          ws.onmessage = (e) => {
            try {
              const msg = JSON.parse(e.data);
              if (msg.type === "progress") {
                setJobProgress(msg.progress);
                setJobStep(msg.step);
                if (msg.log) setJobLogs(prev => [...prev, msg.log]);
              } else if (msg.type === "completed") {
                setJobProgress(1.0);
                setJobStep("Completed successfully!");
                setActiveJobId(null);
                loadVideo();
                onJobCreated && onJobCreated();
              } else if (msg.type === "failed") {
                setJobStep(`Failed: ${msg.error}`);
                setActiveJobId(null);
                loadVideo();
              }
            } catch (err) {}
          };
        } catch (err) {}

        return () => {
          if (ws) ws.close();
        };
      }, [activeJobId]);

      // Calculate Parts from Duration (uses real duration if available, else 3600s)
      const calculatePartsList = () => {
        const totalSec = (video && video.duration_seconds && video.duration_seconds > 0)
          ? video.duration_seconds
          : 3600;
        const partSec = Math.max(60, partDurationMins * 60);
        const totalParts = Math.max(1, Math.ceil(totalSec / partSec));
        const list = [];

        const formatTime = (s) => {
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          const sec = Math.floor(s % 60);
          if (h > 0) {
            return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
          }
          return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        };

        for (let i = 0; i < totalParts; i++) {
          const startSec = i * partSec;
          const endSec = Math.min((i + 1) * partSec, totalSec);
          list.push({
            index: i,
            label: `Part ${i + 1}`,
            start_seconds: startSec,
            duration_seconds: endSec - startSec,
            time_range: `${formatTime(startSec)} - ${formatTime(endSec)}`,
            duration_mins: Math.round(((endSec - startSec) / 60) * 10) / 10
          });
        }
        return list;
      };

      const partsList = calculatePartsList();

      // Synchronize selected parts to select all by default
      useEffect(() => {
        setSelectedPartIndices(partsList.map(p => p.index));
      }, [partsList.length, partDurationMins, video?.duration_seconds]);

      // Polling for live status while jobs are queued or processing
      useEffect(() => {
        const convList = video?.conversions || [];
        const hasPending = convList.some(c => c.status === "queued" || c.status === "processing") || Boolean(activeJobId);
        if (!hasPending) return;

        const interval = setInterval(() => {
          loadVideo();
        }, 3000);

        return () => clearInterval(interval);
      }, [video?.conversions, activeJobId]);

      // Auto-attach WebSocket to the currently processing job in queue
      useEffect(() => {
        const convList = video?.conversions || [];
        if (!activeJobId) {
          const running = convList.find(c => c.status === "processing");
          if (running) {
            setActiveJobId(running.job_id);
          }
        }
      }, [video?.conversions, activeJobId]);

      // Batch queue submission for all parts
      const handleQueueAllParts = async (partsToQueue) => {
        const targetParts = (partsToQueue && partsToQueue.length > 0) ? partsToQueue : partsList;
        if (!targetParts || targetParts.length === 0) {
          alert("No parts available to queue.");
          return;
        }
        if (sourceMode === "link" && !youtubeUrl.trim()) {
          alert("Please enter a valid YouTube video URL.");
          return;
        }
        if (sourceMode === "upload" && !selectedFile && !video?.source_file) {
          alert("Please select or upload a video file, or switch to YouTube link mode.");
          return;
        }

        setIsSubmitting(true);
        setBatchQueueStatus(`Queuing ${targetParts.length} parts into pipeline...`);
        setJobProgress(0.01);
        setJobStep(`Queuing ${targetParts.length} parts in background pipeline...`);
        setJobLogs([`[${new Date().toLocaleTimeString()}] Submitting batch of ${targetParts.length} parts to queue...`]);

        try {
          let currentSourcePath = video?.source_file;
          if (sourceMode === "upload" && selectedFile && !currentSourcePath) {
            setJobStep("Uploading source video file before queuing parts...");
            const up = await handleUploadSourceFile(selectedFile);
            if (!up || !up.source_file) {
              alert("Failed to upload video file before queuing parts.");
              setIsSubmitting(false);
              return;
            }
            currentSourcePath = up.source_file;
          }

          const payload = {
            video_id: videoId,
            youtube_url: sourceMode === "link" ? youtubeUrl.trim() : undefined,
            video_path: sourceMode === "upload" ? (currentSourcePath || video?.source_file || undefined) : undefined,
            target_lang: isMultiLang ? (selectedLangs[0] || targetLang) : targetLang,
            target_langs: isMultiLang ? selectedLangs.join(",") : targetLang,
            voice: selectedVoice,
            whisper_model: whisperModel,
            bg_volume: bgVolume,
            vocals_volume: vocalsVolume,
            speed_cap: speedCap,
            enable_watermark: enableWatermark,
            watermark_text: watermarkText.trim() || undefined,
            gemini_api_key: geminiApiKey.trim() || undefined,
            parts: targetParts.map(p => ({
              part_name: p.label,
              start_seconds: p.start_seconds,
              duration_seconds: p.duration_seconds,
              time_range: p.time_range
            }))
          };

          const res = await fetch("/api/dub/batch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            const data = await res.json();
            setBatchQueueStatus(`✓ All ${targetParts.length} parts added to queue!`);
            if (data.jobs && data.jobs.length > 0) {
              setActiveJobId(data.jobs[0].job_id);
            }
            await loadVideo();
            onJobCreated && onJobCreated();
          } else {
            // Fallback loop if batch endpoint not available
            let queuedCount = 0;
            for (const p of targetParts) {
              const formData = new FormData();
              formData.append("video_id", videoId);
              if (sourceMode === "link") {
                formData.append("youtube_url", youtubeUrl.trim());
              } else {
                formData.append("video_path", currentSourcePath || video?.source_file || "");
              }
              if (isMultiLang) {
                formData.append("target_langs", selectedLangs.join(","));
                formData.append("target_lang", selectedLangs[0] || targetLang);
              } else {
                formData.append("target_lang", targetLang);
              }
              formData.append("voice", selectedVoice);
              formData.append("whisper_model", whisperModel);
              formData.append("bg_volume", String(bgVolume));
              formData.append("vocals_volume", String(vocalsVolume));
              formData.append("speed_cap", String(speedCap));
              formData.append("part_name", p.label);
              formData.append("start_seconds", String(p.start_seconds));
              formData.append("duration_seconds", String(p.duration_seconds));
              if (enableWatermark && watermarkText.trim()) {
                formData.append("enable_watermark", "true");
                formData.append("watermark_text", watermarkText.trim());
              }
              if (geminiApiKey.trim()) {
                formData.append("gemini_api_key", geminiApiKey.trim());
              }

              const singleRes = await fetch("/api/dub", { method: "POST", body: formData });
              if (singleRes.ok) {
                queuedCount++;
                const jData = await singleRes.json();
                if (!activeJobId) setActiveJobId(jData.job_id);
              }
            }
            setBatchQueueStatus(`✓ Queued ${queuedCount} parts in queue!`);
            await loadVideo();
            onJobCreated && onJobCreated();
          }
        } catch (err) {
          alert("Error queuing parts: " + err.message);
        } finally {
          setIsSubmitting(false);
          setTimeout(() => setBatchQueueStatus(""), 4500);
        }
      };

      const handleStartDubbing = async (e) => {
        e.preventDefault();
        if (sourceMode === "link" && !youtubeUrl.trim()) {
          alert("Please enter a valid YouTube video URL.");
          return;
        }
        if (sourceMode === "upload" && !selectedFile && !video?.source_file) {
          alert("Please select or upload a video file, or switch to YouTube link mode.");
          return;
        }

        // If in parts mode, queue selected parts or all parts
        if (splitMode === "parts") {
          if (sourceMode === "upload" && selectedFile && !video?.source_file) {
            setIsSubmitting(true);
            setJobStep("Uploading video file before splitting into parts...");
            const up = await handleUploadSourceFile(selectedFile);
            if (!up) {
              setIsSubmitting(false);
              return;
            }
          }
          const partsToRun = selectedPartIndices.length > 0
            ? partsList.filter(p => selectedPartIndices.includes(p.index))
            : partsList;
          await handleQueueAllParts(partsToRun);
          return;
        }

        setIsSubmitting(true);
        setJobProgress(0.02);
        setJobStep(sourceMode === "upload" && selectedFile ? "Uploading video file and submitting conversion..." : "Submitting full video dubbing job to backend...");
        setJobLogs(["[00:00:00] Initializing full video dubbing job..."]);

        try {
          const formData = new FormData();
          formData.append("video_id", videoId);
          if (sourceMode === "link") {
            formData.append("youtube_url", youtubeUrl.trim());
          } else {
            if (selectedFile) {
              formData.append("video_file", selectedFile);
            } else if (video?.source_file) {
              formData.append("video_path", video.source_file);
            }
          }

          if (isMultiLang) {
            formData.append("target_langs", selectedLangs.join(","));
            formData.append("target_lang", selectedLangs[0] || targetLang);
          } else {
            formData.append("target_lang", targetLang);
          }

          formData.append("voice", selectedVoice);
          formData.append("whisper_model", whisperModel);
          formData.append("bg_volume", String(bgVolume));
          formData.append("vocals_volume", String(vocalsVolume));
          formData.append("speed_cap", String(speedCap));

          if (enableWatermark && watermarkText.trim()) {
            formData.append("enable_watermark", "true");
            formData.append("watermark_text", watermarkText.trim());
          }

          if (geminiApiKey.trim()) {
            formData.append("gemini_api_key", geminiApiKey.trim());
          }

          const res = await fetch("/api/dub", {
            method: "POST",
            body: formData
          });

          if (res.ok) {
            const jobRes = await res.json();
            setSelectedFile(null);
            setActiveJobId(jobRes.job_id);
            setBatchQueueStatus(
              jobRes.status === "processing"
                ? "✓ Video conversion started!"
                : "✓ Video added to conversion queue! Will start automatically when current task finishes."
            );
            setTimeout(() => setBatchQueueStatus(""), 5000);
            onJobCreated && onJobCreated();
            loadVideo();
          } else {
            const err = await res.json().catch(() => ({}));
            alert("Failed to submit job: " + (err.detail || "Server error"));
          }
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleOpenSeoPack = async (jobId, initialLang = "de") => {
        setIsFetchingPack(true);
        setActiveSeoLang(initialLang);
        setIsSeoModalOpen(true);
        try {
          const res = await fetch(`/api/jobs/${jobId}/generate-seo-pack`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lang: initialLang, gemini_api_key: geminiApiKey.trim() || undefined })
          });
          if (res.ok) {
            const pack = await res.json();
            setSeoPackData(pack);
          }
        } catch (e) {
          console.error("Error fetching SEO pack:", e);
        } finally {
          setIsFetchingPack(false);
        }
      };

      if (isLoading) {
        return <div className="text-center py-16 text-slate-400">Loading video project details...</div>;
      }

      if (!video) {
        return (
          <div className="text-center py-16">
            <p className="text-red-400 mb-4">Video project not found.</p>
            <button type="button" onClick={onBack} className="px-4 py-2 bg-brand-600 text-white rounded-xl">
              Back to Videos
            </button>
          </div>
        );
      }

      const conversions = video.conversions || [];

      return (
        <div className="space-y-8">
          {/* Header */}
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-800">
            <div>
              <button
                type="button"
                onClick={onBack}
                className="text-xs font-semibold text-slate-400 hover:text-white mb-2 flex items-center transition"
              >
                <Icons.ArrowLeft />
                <span>Back to Videos List</span>
              </button>

              <h2 className="text-2xl font-black text-white">{video.title}</h2>
              <div className="flex flex-wrap items-center gap-3 mt-1.5 text-xs">
                <span className="font-mono text-slate-400 bg-surface-900 px-2 py-0.5 rounded border border-white/5">
                  ID: {video.id}
                </span>

                {video.youtube_url ? (
                  <a
                    href={video.youtube_url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-brand-400 hover:text-brand-300 font-semibold inline-flex items-center"
                  >
                    <span>View on YouTube</span>
                    <Icons.ExternalLink />
                  </a>
                ) : video.source_file ? (
                  <span className="text-emerald-400 font-semibold inline-flex items-center gap-1.5">
                    <span>📁 Local Upload:</span>
                    <span className="text-slate-300 font-mono">{video.source_file_name || "Video File"}</span>
                  </span>
                ) : null}

                <div className="flex items-center gap-1">
                  {(video.languages || []).map(code => (
                    <span
                      key={code}
                      className="px-2 py-0.5 rounded bg-surface-850 text-slate-300 font-bold border border-white/5 text-[11px]"
                    >
                      {LANG_MAP[code]?.flag} {code.toUpperCase()}
                    </span>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                type="button"
                onClick={handleDeleteVideoProject}
                className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 border border-red-500/30 font-bold text-xs transition shadow-sm"
                title="Delete this video project"
              >
                <Icons.Trash />
                <span>Delete Video</span>
              </button>
            </div>
          </div>

          {/* Active Job Real-Time Card */}
          {activeJobId && (() => {
            const activeConv = (video?.conversions || []).find(c => c.job_id === activeJobId);
            const isQueued = activeConv ? activeConv.status === "queued" : (jobProgress <= 0.02 && jobStep.toLowerCase().includes("queue"));
            return (
              <div className={`glass-card rounded-2xl p-6 border ${isQueued ? 'border-amber-500/30 shadow-xl shadow-amber-500/5' : 'border-brand-500/30 shadow-xl shadow-brand-500/10'}`}>
                <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                  <div className="flex items-center gap-2">
                    {isQueued ? (
                      <span className="text-base">⏳</span>
                    ) : (
                      <span className="w-2.5 h-2.5 rounded-full bg-brand-400 animate-ping"></span>
                    )}
                    <h3 className="font-bold text-white text-sm">
                      {isQueued ? "Video Queued in Pipeline" : "Dubbing in Progress for this Video"}
                    </h3>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${isQueued ? 'bg-amber-500/10 text-amber-300 border border-amber-500/20' : 'bg-brand-500/10 text-brand-300 border border-brand-500/20 animate-pulse'}`}>
                      {isQueued ? "In Queue (Waiting Turn)" : `${Math.round(jobProgress * 100)}% Running`}
                    </span>
                  </div>
                  <div className="flex items-center gap-2">
                    {onCancelJob && (
                      <button
                        type="button"
                        onClick={() => onCancelJob(activeJobId, activeConv?.part_name || video?.title || "Video")}
                        className="px-2.5 py-1 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-300 hover:text-white border border-red-500/30 text-xs font-bold transition flex items-center gap-1 shadow-sm"
                        title="Stop / Cancel this task"
                      >
                        <Icons.Stop />
                        <span>{isQueued ? "Cancel Queue" : "Stop Task"}</span>
                      </button>
                    )}
                  </div>
                </div>
                <div className="w-full bg-surface-900 rounded-full h-2.5 overflow-hidden mb-2">
                  <div
                    className={`${isQueued ? 'bg-amber-400 animate-pulse' : 'bg-brand-500'} h-2.5 rounded-full transition-all duration-300`}
                    style={{ width: isQueued ? "100%" : `${Math.max(5, Math.round(jobProgress * 100))}%` }}
                  ></div>
                </div>
                <p className="text-xs text-slate-300 flex items-center justify-between">
                  <span>{jobStep || (isQueued ? "Waiting in queue. Processing will begin automatically in background as soon as preceding conversions finish." : "Processing video...")}</span>
                  <span className="font-mono text-slate-400 text-[11px]">Job: {activeJobId}</span>
                </p>
              </div>
            );
          })()}

          {/* SECTION 1: Dubbing Studio Form (Current Form) */}
          <div className="glass-card rounded-2xl p-6 border border-white/10">
            <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
              <div>
                <h3 className="font-bold text-lg text-white">Conversion Studio</h3>
                <p className="text-xs text-slate-400">
                  Configure language, voices, and full video or multipart segmentation
                </p>
              </div>
              <span className="text-xs px-3 py-1 rounded-full bg-brand-500/10 text-brand-400 font-bold border border-brand-500/20">
                Studio Controls
              </span>
            </div>

            <form onSubmit={handleStartDubbing} className="space-y-6">
              {/* Video Source Selector: Link or Upload */}
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-bold uppercase tracking-wider text-slate-300">
                    Video Source
                  </label>
                  <div className="inline-flex rounded-xl bg-surface-900 p-1 border border-slate-800">
                    <button
                      type="button"
                      onClick={() => setSourceMode("link")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${sourceMode === "link" ? "bg-brand-600 text-white shadow-sm" : "text-slate-400 hover:text-white"}`}
                    >
                      <span>🔗 YouTube Link</span>
                    </button>

                          className="px-2.5 py-1.5 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-300 hover:text-white border border-red-500/30 text-xs font-bold transition flex items-center gap-1.5"
                          title="Stop and cancel this job"
                        >
                          <Icons.Stop />
                          <span>{isProcessing ? "Stop" : "Cancel"}</span>
                        </button>
                      )}

                      <button
                        type="button"
                        onClick={() => handleDeleteConversion(conv.job_id, conv.part_name)}
                        className="p-1.5 rounded-lg bg-surface-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-white/5 transition"
                        title="Delete this converted video"
                      >
                        <Icons.Trash />
                      </button>
                    </div>
                  </div>
                );
              })}
              </div>
            )}
          </div>

          {/* SEO & Thumbnail Pack Modal */}
          {isSeoModalOpen && (
            <SeoModal
              isOpen={isSeoModalOpen}
              onClose={() => setIsSeoModalOpen(false)}
              seoData={seoPackData}
              activeLang={activeSeoLang}
              onLangChange={setActiveSeoLang}
              isFetching={isFetchingPack}
              copiedField={copiedField}
              onCopy={(text, field) => {
                navigator.clipboard.writeText(text);
                setCopiedField(field);
                setTimeout(() => setCopiedField(null), 2000);
              }}
            />
          )}
        </div>
      );
    }

    function AddVideoModal({ onClose, onCreated }) {
      const [sourceMode, setSourceMode] = useState("link"); // 'link' or 'upload'
      const [selectedFile, setSelectedFile] = useState(null);
      const [title, setTitle] = useState("");
      const [youtubeUrl, setYoutubeUrl] = useState("");
      const [durationSeconds, setDurationSeconds] = useState(null);
      const [isFetchingInfo, setIsFetchingInfo] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [authStatus, setAuthStatus] = useState(null);
      const [isSyncingCookies, setIsSyncingCookies] = useState(false);
      const [fetchError, setFetchError] = useState("");

      const [showCookieTools, setShowCookieTools] = useState(false);
      const [pastedCookies, setPastedCookies] = useState("");
      const [isSavingCookies, setIsSavingCookies] = useState(false);

      useEffect(() => {
        fetch("/api/youtube/auth-status")
          .then(res => res.json())
          .then(data => setAuthStatus(data))
          .catch(() => {});
      }, []);

      const handleSyncCookies = async () => {
        setIsSyncingCookies(true);
        try {
          const res = await fetch("/api/youtube/sync-cookies", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ browser: "chrome" })
          });
          const data = await res.json();
          if (data.auth_status) setAuthStatus(data.auth_status);
          alert(data.message || "Cookies synced successfully!");
        } catch (e) {
          alert("Error syncing cookies: " + e.message);
        } finally {
          setIsSyncingCookies(false);
        }
      };

      const handleUploadCookieFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const formData = new FormData();
        formData.append("file", file);
        try {
          const res = await fetch("/api/youtube/upload-cookies", {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          if (res.ok) {
            if (data.auth_status) setAuthStatus(data.auth_status);
            alert(data.message || "Cookies installed successfully on this server!");
          } else {
            alert("Upload failed: " + (data.detail || "Unknown error"));
          }
        } catch (err) {
          alert("Upload error: " + err.message);
        }
      };

      const handleSavePastedCookies = async () => {
        if (!pastedCookies.trim()) return;
        setIsSavingCookies(true);
        try {
          const res = await fetch("/api/youtube/paste-cookies", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cookies_text: pastedCookies.trim() }),
          });
          const data = await res.json();
          if (res.ok) {
            if (data.auth_status) setAuthStatus(data.auth_status);
            alert(data.message || "Cookies saved successfully!");
            setPastedCookies("");
            setShowCookieTools(false);
          } else {
            alert("Failed: " + (data.detail || "Error saving cookies"));
          }
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          setIsSavingCookies(false);
        }
      };

      const handleFetchInfo = async () => {
        if (!youtubeUrl.trim()) return;
        setIsFetchingInfo(true);
        setFetchError("");
        try {
          const res = await fetch("/api/video-info", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: youtubeUrl.trim() })
          });
          if (res.ok) {
            const data = await res.json();
            if (data.title && !title) setTitle(data.title);
            if (data.duration_seconds) setDurationSeconds(data.duration_seconds);
          } else {
            const err = await res.json();
            setFetchError(err.detail || "Failed to fetch video details from YouTube");
          }
        } catch (e) {
          console.error("Failed to fetch info:", e);
          setFetchError(e.message || "Network error fetching video info");
        } finally {
          setIsFetchingInfo(false);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (sourceMode === "upload") {
          if (!selectedFile) {
            alert("Please select a video file to upload.");
            return;
          }
          setIsSaving(true);
          try {
            const formData = new FormData();
            formData.append("file", selectedFile);
            if (title.trim()) formData.append("title", title.trim());
            const res = await fetch("/api/videos/upload", {
              method: "POST",
              body: formData
            });
            if (res.ok) {
              const created = await res.json();
              onCreated(created);
            } else {
              const err = await res.json().catch(() => ({}));
              alert("Failed to upload video: " + (err.detail || "Server error"));
            }
          } catch (e) {
            alert("Error: " + e.message);
          } finally {
            setIsSaving(false);
          }
          return;
        }

        if (!title.trim() || !youtubeUrl.trim()) return;

        setIsSaving(true);
        try {
          const res = await fetch("/api/videos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: title.trim(),
              youtube_url: youtubeUrl.trim(),
              duration_seconds: durationSeconds
            })
          });
          if (res.ok) {
            const created = await res.json();
            onCreated(created);
          } else {
            alert("Failed to create video project.");
          }
        } catch (e) {
          alert("Error: " + e.message);
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="glass-card rounded-2xl p-6 w-full max-w-lg border border-white/10 shadow-2xl max-h-[92vh] overflow-y-auto">
            <h3 className="text-lg font-bold text-white mb-1">Add New Video Project</h3>

            {/* Source Mode Switcher */}
            <div className="flex rounded-xl bg-surface-900 p-1 border border-slate-800 mb-4">
              <button
                type="button"
                onClick={() => setSourceMode("link")}

              >
                <span>🔗 YouTube Link</span>
              </button>
              <button
                type="button"
                onClick={() => setSourceMode("upload")}
                className={`flex-1 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${sourceMode === "upload" ? "bg-brand-600 text-white shadow-sm" : "text-slate-400 hover:text-white"}`}
              >
                <span>📁 Upload Video File</span>
              </button>
            </div>

            {sourceMode === "link" && (
              <>
                {/* YouTube Account & Cookie Auth Badge */}
                <div className="p-3 rounded-xl bg-surface-900 border border-slate-700/80 mb-3 space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-lg bg-red-600/20 text-red-400 flex items-center justify-center font-bold text-xs border border-red-500/20 flex-shrink-0">
                        YT
                      </div>
                      <div>
                        <div className="text-xs font-bold text-white flex items-center gap-1.5 flex-wrap">
                          <span>{authStatus?.email || "manhwadesistyle@gmail.com"}</span>
                          {authStatus?.has_cookies ? (
                            <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold border border-emerald-500/30 flex items-center gap-1">
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                              <span>Logged In ({authStatus?.cookie_count || 511} cookies)</span>
                            </span>
                          ) : (
                            <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-semibold border border-amber-500/30">
                              Cookie Needed on VM
                            </span>
                          )}
                        </div>
                        <div className="text-[11px] text-slate-400 mt-0.5">
                          Bypasses bot checks & sign-in requirements on Mac and Linux VMs
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-1.5">
                      <button
                        type="button"
                        onClick={handleSyncCookies}
                        disabled={isSyncingCookies}
                        className="px-2.5 py-1.5 rounded-lg bg-surface-800 hover:bg-surface-700 text-slate-200 border border-white/5 text-xs font-semibold transition flex items-center gap-1 flex-shrink-0"
                        title="Sync latest YouTube session cookies from Chrome"
                      >
                        <span>{isSyncingCookies ? "Syncing..." : "🔄 Re-sync"}</span>
                      </button>
                    </div>
                  </div>

                  {/* VM Transfer and Cookie Management Toggle */}
                  <div className="pt-1 border-t border-slate-800/80 flex items-center justify-between text-[11px]">
                    <button
                      type="button"
                      onClick={() => setShowCookieTools(!showCookieTools)}
                      className="text-brand-400 hover:text-brand-300 font-semibold inline-flex items-center gap-1 transition"
                    >
                      <span>{showCookieTools ? "▾ Hide VM / Remote Server Tools" : "▸ VM & Cookie Transfer Tools"}</span>
                    </button>
                    <div className="flex items-center gap-2">
                      <a
                        href="/api/youtube/export-cookies"
                        download="cookies.txt"
                        className="text-slate-400 hover:text-white transition font-medium underline"
                        title="Download active cookies.txt to transfer to VM"
                      >
                        Export cookies.txt
                      </a>
                      {authStatus?.is_vm && (
                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                          VM Mode
                        </span>
                      )}
                    </div>
                  </div>

                  {/* Expandable VM Cookie Upload / Paste Drawer */}
                  {showCookieTools && (
                    <div className="p-3 rounded-lg bg-surface-950 border border-slate-800 space-y-2 mt-2">
                      <div className="flex items-center justify-between text-[11px]">
                        <span className="font-bold text-slate-300">Set Cookies for Remote VM</span>
                        <label className="px-2.5 py-1 rounded bg-brand-600/30 hover:bg-brand-600/50 text-brand-200 border border-brand-500/30 font-semibold cursor-pointer transition text-[11px]">
                          <span>📁 Upload cookies.txt</span>
                          <input type="file" accept=".txt" onChange={handleUploadCookieFile} className="hidden" />
                        </label>
                      </div>
                      <p className="text-[10px] text-slate-400">
                        If this server is running on a cloud VM without a desktop browser: download cookies.txt from your local Mac, then upload or paste below.
                      </p>
                      <div className="space-y-1.5">
                        <textarea
                          rows="2"
                          value={pastedCookies}
                          onChange={(e) => setPastedCookies(e.target.value)}
                          placeholder="Paste Netscape cookies.txt content here..."
                          className="w-full px-2.5 py-1.5 rounded-lg bg-surface-900 border border-slate-700 font-mono text-[10px] text-slate-200 outline-none focus:border-brand-500"
                        />
                        {pastedCookies && (
                          <button

                            onClick={handleSavePastedCookies}
                            disabled={isSavingCookies}
                            className="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] transition"
                          >
                            {isSavingCookies ? "Saving..." : "Install Cookies on VM"}
                          </button>

                      </div>
                    </div>
                  )}
                </div>

                {fetchError && (

                    <div>

            <form onSubmit={handleSubmit} className="space-y-4">

                      value={youtubeUrl}
                      onChange={(e) => setYoutubeUrl(e.target.value)}

        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">

                      onClick={() => onCopy(meta.tags || "", "tags")}
                      className="text-xs text-brand-400 hover:text-brand-300 font-semibold"
                    >
                      {copiedField === "tags" ? "Copied!" : "Copy Tags"}
                    </button>
                  </div>
                  <div className="p-3 rounded-xl bg-surface-900 border border-slate-700 text-xs text-slate-300">
                    {meta.tags || "No tags generated"}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // YTD Helper Functions
    // =========================================================================
    function formatYtdDuration(seconds) {
      if (!seconds || seconds <= 0) return "--:--";
      const secNum = parseInt(seconds, 10);
      const hours = Math.floor(secNum / 3600);
      const minutes = Math.floor((secNum % 3600) / 60);
      const secs = secNum % 60;
      if (hours > 0) {
        return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }
      return `${minutes}:${secs.toString().padStart(2, '0')}`;
    }

    // =========================================================================
    // YTD Channel Details View Component
    // =========================================================================
    function YtdChannelDetailsView({
      channelId,
      onBack,
      onDownloadVideo,
      onDeleteVideo,
      onSyncChannel
    }) {
      const [channel, setChannel] = useState(null);
      const [videos, setVideos] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isSyncing, setIsSyncing] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");

      const loadChannelAndVideos = async () => {
        try {
          const [chRes, vidsRes] = await Promise.all([
            fetch(`/api/ytd/channels/${channelId}`),
            fetch(`/api/ytd/channels/${channelId}/videos?limit=250`)
          ]);
          if (chRes.ok) {
            setChannel(await chRes.json());
          }
          if (vidsRes.ok) {
            const vidsData = await vidsRes.json();
            setVideos(Array.isArray(vidsData) ? vidsData : (vidsData.videos || []));
          }
        } catch (err) {
          console.error("Failed to load channel videos:", err);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        loadChannelAndVideos();
      }, [channelId]);

      // Polling for active background downloads
      useEffect(() => {
        const hasActive = (videos || []).some(v => ['queued', 'downloading', 'splitting', 'generating_shorts'].includes(v.download_status));
        if (!hasActive) return;

        const interval = setInterval(async () => {
          try {
            const res = await fetch(`/api/ytd/channels/${channelId}/videos?limit=250`);
            if (res.ok) {
              const fresh = await res.json();
              setVideos(Array.isArray(fresh) ? fresh : (fresh.videos || []));
            }
          } catch (e) {
            console.error("Polling error:", e);
          }
        }, 3000);

        return () => clearInterval(interval);
      }, [channelId, videos]);

      const handleManualSync = async () => {
        setIsSyncing(true);
        try {
          await onSyncChannel(channelId);
          await loadChannelAndVideos();
        } finally {
          setIsSyncing(false);
        }
      };

      const handleDelete = async (vid) => {
        const success = await onDeleteVideo(vid.id, vid.title);
        if (success) {
          setVideos(prev => prev.filter(v => v.id !== vid.id));
        }
      };

      // Filtered videos
      const filteredVideos = (videos || []).filter(v => {
        const matchesSearch =
          (v.title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
          (v.youtube_id || "").toLowerCase().includes(searchQuery.toLowerCase());

        if (!matchesSearch) return false;
        if (statusFilter === "downloaded") return Boolean(v.is_downloaded);
        if (statusFilter === "not_downloaded") return !v.is_downloaded;
        return true;
      });

      const downloadedCount = (videos || []).filter(v => Boolean(v.is_downloaded)).length;

      return (
        <div className="space-y-6 animate-fadeIn">
          {/* Top Bar Navigation */}
          <div className="flex items-center justify-between">
            <button
              type="button"
              onClick={onBack}
              className="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-surface-900 hover:bg-surface-850 text-slate-300 hover:text-white border border-white/5 text-xs font-semibold transition"
            >
              <Icons.ArrowLeft />
              <span>Back to All Channels</span>
            </button>
            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={handleManualSync}
                disabled={isSyncing}
                className={`flex items-center gap-2 px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition shadow-lg shadow-red-500/25 ${isSyncing ? 'opacity-70 cursor-not-allowed' : ''}`}
              >
                <span className={isSyncing ? "animate-spin" : ""}>
                  <Icons.Refresh />
                </span>
                <span>{isSyncing ? "Syncing Videos..." : "Sync Channel Now"}</span>
              </button>
            </div>
          </div>

          {/* Channel Banner Card */}
          <div className="p-6 rounded-2xl glass-card border border-white/5 bg-gradient-to-r from-surface-900 via-surface-850 to-red-950/20 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div className="flex items-center gap-4 overflow-hidden">
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-600 flex items-center justify-center text-white text-xl font-black shadow-lg shadow-red-600/30 flex-shrink-0">
                <Icons.Youtube />
              </div>
              <div className="overflow-hidden">
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-500/10 text-red-400 border border-red-500/20 uppercase tracking-widest">
                    Tracked Channel
                  </span>
                  {channel?.last_synced_at && (
                    <span className="text-[10px] text-slate-500">
                      Synced {new Date(channel.last_synced_at).toLocaleTimeString()}
                    </span>
                  )}
                </div>
                <h2 className="text-xl font-black text-white truncate mt-1">
                  {channel?.title || "Channel Videos"}
                </h2>
                {channel?.url && (
                  <a
                    href={channel.url}
                    target="_blank"

              <button
                type="button"

              <button
                type="button"
                onClick={() => setStatusFilter("not_downloaded")}

              >

            </div>

          {/* Video List */}
          {isLoading ? (
            <div className="flex flex-col items-center justify-center p-16 text-slate-400">
              <div className="w-8 h-8 border-2 border-red-500 border-t-transparent rounded-full animate-spin mb-4"></div>

            </div>
          ) : filteredVideos.length === 0 ? (
            <div className="p-16 rounded-2xl glass-card border border-white/5 text-center flex flex-col items-center justify-center">
              <div className="w-12 h-12 rounded-2xl bg-red-600/10 text-red-400 flex items-center justify-center mb-3">
                <Icons.Youtube />
              </div>
              <h3 className="text-sm font-bold text-white mb-1">No videos found</h3>
              <p className="text-xs text-slate-400 max-w-sm mb-4">
                {searchQuery ? "No videos match your search query." : "No videos have been synced for this channel yet."}
              </p>
              {!searchQuery && (
                <button
                  type="button"
                  onClick={handleManualSync}
                  className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition"
                >
                  Sync Videos Now
                </button>
              )}
            </div>
          ) : (
            <div className="space-y-3">
              {filteredVideos.map((vid) => {
                const isProcessing = ['queued', 'downloading', 'splitting', 'generating_shorts'].includes(vid.download_status);
