    // =========================================================================
    // Interactive SVG Pie / Donut Chart for Languages
    // =========================================================================
    function LanguagePieChart({ data = {}, size = 260 }) {
      const entries = Object.entries(data).map(([code, count]) => {
        const meta = LANG_MAP[code] || { name: code.toUpperCase(), flag: "🌐", color: "#6366f1" };
        return {
          code,
          name: meta.name,
          flag: meta.flag,
          color: meta.color || "#6366f1",
          value: count
        };
      }).sort((a, b) => b.value - a.value);

      const total = entries.reduce((s, e) => s + e.value, 0);

      const [hoveredSlice, setHoveredSlice] = useState(null);

      if (total === 0 || entries.length === 0) {
        return (
          <div className="flex flex-col items-center justify-center h-64 text-gray-500">
            <p>No video conversions recorded yet.</p>
          </div>
        );
      }

      const innerRadius = 60;
      const outerRadius = 95;
      const cx = size / 2;
      const cy = size / 2;

      let currentAngle = 0;
      const slices = entries.map((entry, index) => {
        const fraction = entry.value / total;
        const angle = fraction * 2 * Math.PI;
        const startAngle = currentAngle;
        const endAngle = currentAngle + angle;
        currentAngle += angle;

        const x1 = cx + outerRadius * Math.cos(startAngle - Math.PI / 2);
        const y1 = cy + outerRadius * Math.sin(startAngle - Math.PI / 2);
        const x2 = cx + outerRadius * Math.cos(endAngle - Math.PI / 2);
        const y2 = cy + outerRadius * Math.sin(endAngle - Math.PI / 2);

        const x3 = cx + innerRadius * Math.cos(endAngle - Math.PI / 2);
        const y3 = cy + innerRadius * Math.sin(endAngle - Math.PI / 2);
        const x4 = cx + innerRadius * Math.cos(startAngle - Math.PI / 2);
        const y4 = cy + innerRadius * Math.sin(startAngle - Math.PI / 2);

        const largeArc = fraction > 0.5 ? 1 : 0;
        const pathData = `
          M ${x1} ${y1}
          A ${outerRadius} ${outerRadius} 0 ${largeArc} 1 ${x2} ${y2}
          L ${x3} ${y3}
          A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${x4} ${y4}
          Z
        `;

        return {
          ...entry,
          pathData,
          percentage: Math.round(fraction * 100)
        };
      });

      return (
        <div className="flex flex-col sm:flex-row items-center gap-6 justify-center">
          <div className="relative flex items-center justify-center">
            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
              {slices.map((slice, idx) => (
                <path
                  key={slice.code}
                  d={slice.pathData}
                  fill={slice.color}
                  stroke="#13151b"
                  strokeWidth="3"
                  className="transition-transform duration-200 cursor-pointer hover:opacity-90"
                  onMouseEnter={() => setHoveredSlice(slice)}
                  onMouseLeave={() => setHoveredSlice(null)}
                />
              ))}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              {hoveredSlice ? (
                <>
                  <span className="text-xl">{hoveredSlice.flag}</span>
                  <span className="text-xs font-semibold text-slate-300">{hoveredSlice.name}</span>
                  <span className="text-sm font-bold text-white">{hoveredSlice.value} vids ({hoveredSlice.percentage}%)</span>
                </>
              ) : (
                <>
                  <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total</span>
                  <span className="text-2xl font-black text-white">{total}</span>
                  <span className="text-[10px] text-gray-400">Conversions</span>
                </>
              )}
            </div>
          </div>

          <div className="flex flex-col gap-2 max-h-56 overflow-y-auto pr-2 text-xs w-full sm:w-48">
            {slices.map(s => (
              <div
                key={s.code}
                onMouseEnter={() => setHoveredSlice(s)}
                onMouseLeave={() => setHoveredSlice(null)}
                className={`flex items-center justify-between p-1.5 rounded-lg transition cursor-pointer ${hoveredSlice?.code === s.code ? 'bg-surface-800' : 'hover:bg-surface-850'}`}
              >
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: s.color }}></span>
                  <span>{s.flag}</span>
                  <span className="font-medium text-slate-200">{s.name}</span>
                </div>
                <span className="font-bold text-slate-400">{s.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Apple Silicon Unified Memory RAM Donut Chart
    // =========================================================================
    function RamDonutChart({ ram = { percent: 0, used_gb: 0, free_gb: 0, total_gb: 0 }, onRefresh }) {
      const radius = 80;
      const strokeWidth = 20;
      const circumference = 2 * Math.PI * radius;
      const percent = Math.min(100, Math.max(0, ram.percent || 0));
      const strokeDashoffset = circumference - (percent / 100) * circumference;

      return (
        <div className="flex flex-col sm:flex-row items-center justify-center gap-6">
          <div className="relative flex items-center justify-center">
            <svg width="220" height="220" viewBox="0 0 220 220" className="transform -rotate-90">
              <circle
                cx="110"
                cy="110"
                r={radius}
                stroke="#1e212b"
                strokeWidth={strokeWidth}
                fill="transparent"
              />
              <circle
                cx="110"
                cy="110"
                r={radius}
                stroke="url(#ramGrad)"
                strokeWidth={strokeWidth}
                fill="transparent"
                strokeDasharray={circumference}
                strokeDashoffset={strokeDashoffset}
                strokeLinecap="round"
                className="transition-all duration-1000 ease-out"
              />
              <defs>
                <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#06b6d4" />
                  <stop offset="50%" stopColor="#0ea5e9" />
                  <stop offset="100%" stopColor="#6366f1" />
                </linearGradient>
              </defs>
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              <span className="text-3xl font-black text-white">{percent}%</span>
              <span className="text-[11px] text-cyan-400 font-semibold tracking-wider uppercase">RAM Used</span>
            </div>
          </div>

          <div className="flex flex-col gap-3 text-xs w-full sm:w-44">
            <div className="p-2.5 rounded-lg bg-surface-850 border border-white/5">
              <div className="text-gray-400">Used Memory</div>
              <div className="text-base font-bold text-indigo-300">{ram.used_gb} GB</div>
            </div>
            <div className="p-2.5 rounded-lg bg-surface-850 border border-white/5">
              <div className="text-gray-400">Free / Available</div>
              <div className="text-base font-bold text-emerald-400">{ram.free_gb} GB</div>
            </div>
            <div className="flex items-center justify-between text-gray-400 px-1">
              <span>Total Unified:</span>
              <span className="font-bold text-white">{ram.total_gb} GB</span>
            </div>
            {onRefresh && (
              <button
                type="button"
                onClick={onRefresh}
                className="flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-lg bg-surface-800 hover:bg-surface-700 text-slate-300 font-medium transition"
              >
                <Icons.Refresh />
                <span>Refresh RAM</span>
              </button>
            )}
          </div>
        </div>
      );
    }

      const [directStats, setDirectStats] = useState(null);
      const [isLoadingDirect, setIsLoadingDirect] = useState(false);

      // Fetch system stats
      const fetchStats = async () => {
        try {
          const res = await fetch("/api/system/stats");
          if (res.ok) {
            const data = await res.json();
            setSystemStats(data);
          }
        } catch (err) {
          console.error("Failed to load system stats:", err);
        }
      };

      // Fetch videos list
      const fetchVideos = async () => {
        setIsLoadingVideos(true);
        try {
          const res = await fetch("/api/videos");
          if (res.ok) {
            const data = await res.json();
            setVideosList(data);
          }
        } catch (err) {
          console.error("Failed to load videos:", err);
        } finally {
          setIsLoadingVideos(false);
        }
      };

      // Fetch YTD channels
      const fetchYtdChannels = async () => {
        setIsLoadingYtd(true);
        try {
          const res = await fetch("/api/ytd/channels");
          if (res.ok) {
            const data = await res.json();
            setYtdChannels(data);
          }
        } catch (err) {
          console.error("Failed to load YTD channels:", err);
        } finally {
          setIsLoadingYtd(false);
        }
      };

      // Fetch YTD stats
      const fetchYtdStats = async () => {
        try {
          const res = await fetch("/api/ytd/stats");
          if (res.ok) {
            const data = await res.json();
            setYtdStats(data);
          }
        } catch (err) {
          console.error("Failed to load YTD stats:", err);
        }
      };

      // Fetch Direct videos
      const fetchDirectVideos = async (search = "", status = "all") => {
        setIsLoadingDirect(true);
        try {
          const q = new URLSearchParams();
          if (search) q.append("search", search);
          if (status && status !== "all") q.append("status", status);
          const res = await fetch(`/api/direct/videos?${q.toString()}`);
          if (res.ok) {
            const data = await res.json();
            setDirectVideos(Array.isArray(data) ? data : []);
          }
        } catch (err) {
          console.error("Failed to load direct videos:", err);
        } finally {
          setIsLoadingDirect(false);
        }
      };

      // Fetch Direct stats
      const fetchDirectStats = async () => {
        try {
          const res = await fetch("/api/direct/stats");
          if (res.ok) {
            const data = await res.json();
            setDirectStats(data);
          }
        } catch (err) {
          console.error("Failed to load direct stats:", err);
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          fetchStats();
          fetchVideos();
          fetchYtdChannels();
          fetchYtdStats();
          fetchDirectVideos();
          fetchDirectStats();
          const isBusy = (systemStats?.counts?.active_jobs > 0) || (systemStats?.queue_summary?.total_pending > 0);
          const intervalMs = isBusy ? 3000 : 8000;
          const timer = setInterval(() => {
            fetchStats();
            fetchYtdStats();
            fetchDirectStats();
          }, intervalMs);
          return () => clearInterval(timer);
        }
      }, [isAuthenticated, systemStats?.counts?.active_jobs, systemStats?.queue_summary?.total_pending]);

      // Polling for active direct downloads
      useEffect(() => {
        if (!isAuthenticated) return;
        const hasActive = (directVideos || []).some(v => ['queued', 'downloading'].includes(v.download_status));
        if (!hasActive) return;

        const interval = setInterval(() => {
          fetchDirectVideos();
          fetchDirectStats();

        return () => clearInterval(interval);

                <div className="flex items-center justify-between text-slate-400 mb-1.5">
                  <span className="font-semibold text-slate-300">
                    {systemStats?.hardware?.os === 'Darwin' ? 'System RAM' : 'Server Memory'}

                  <span className="font-bold text-cyan-400">{systemStats?.ram?.percent || 0}%</span>
                </div>
                <div className="w-full bg-surface-900 rounded-full h-1.5 overflow-hidden">
                  <div

                    style={{ width: `${systemStats?.ram?.percent || 0}%` }}

                </div>
                <div className="flex justify-between items-center mt-2 text-[10px] text-slate-500">
                  <span>{systemStats?.ram?.used_gb || 0} GB Used</span>
                  <span>{systemStats?.ram?.total_gb || 0} GB Total</span>

              {/* User Profile Card */}
              <div className="flex items-center justify-between pt-2">
                <div className="flex items-center gap-2.5 overflow-hidden">
                  <div className="w-8 h-8 rounded-full bg-indigo-700 flex items-center justify-center font-bold text-xs text-white flex-shrink-0">
                    AD

                  <div className="overflow-hidden">
                    <p className="text-xs font-bold text-white truncate">admin@admin.com</p>
                    <p className="text-[10px] text-slate-400">Super Admin</p>

                <button

          {/* Main Content Area */}

            <header className="h-16 px-8 border-b border-slate-800 flex items-center justify-between flex-shrink-0 bg-surface-950/80 backdrop-blur sticky top-0 z-10">
              <div className="flex items-center gap-2 text-sm">
                <span className="text-slate-400">Admin</span>
                <span className="text-slate-600">/</span>
                <span className="font-bold text-white capitalize">
                  {activeTab === 'video_details' ? 'Video Project Details' : activeTab === 'ytd_channel_details' ? 'Channel Videos' : activeTab === 'ytd' ? 'YouTube Downloader (YTD)' : activeTab === 'direct' ? 'Direct YouTube Downloader' : activeTab}
                </span>
              </div>

              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>{systemStats?.hardware?.engine_label || 'Hardware Acceleration Engine Active'}</span>
                </div>

                {activeTab === 'ytd' ? (
                  <button
                    type="button"
                    onClick={() => setIsAddChannelModalOpen(true)}
                    className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs transition shadow-md shadow-red-500/20"
                  >
                    <Icons.Plus />
                    <span>Add New Channel</span>
                  </button>
                ) : activeTab === 'ytd_channel_details' ? (
                  <button
                    type="button"
                    onClick={() => { setActiveTab('ytd'); setSelectedChannelId(null); fetchYtdChannels(); }}
                    className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-slate-200 font-bold text-xs transition border border-white/10"
                  >
                    <Icons.ArrowLeft />
                    <span>Back to Channels</span>
                  </button>
                ) : activeTab === 'direct' ? (
                  <button
                    type="button"
                    onClick={() => {
                      const el = document.getElementById("direct-url-input");
                      if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth' }); }
                    }}
                    className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold text-xs transition shadow-md shadow-amber-500/20"
                  >
                    <Icons.Plus />
                    <span>Add YouTube Link</span>
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={() => setIsAddVideoModalOpen(true)}
                    className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs transition shadow-md shadow-brand-500/20"
                  >
                    <Icons.Plus />
                    <span>Add New Video</span>
                  </button>
                )}
              </div>
            </header>

            {/* View Switching */}
            <div className="p-8 max-w-7xl w-full mx-auto">
              {activeTab === "dashboard" && (
                <DashboardView
                  stats={systemStats}
                  onRefresh={fetchStats}
                  onOpenVideoDetails={handleOpenVideoDetails}
                  onAddVideo={() => setIsAddVideoModalOpen(true)}
                  videosList={videosList}
                  onDeleteVideo={handleDeleteVideoProject}
                  onCancelJob={handleCancelJob}
                  onCancelAllQueue={handleCancelAllQueue}
                />
              )}

              {activeTab === "videos" && (
                <VideosListView
                  videos={videosList}
                  isLoading={isLoadingVideos}
                  onRefresh={fetchVideos}
                  onOpenDetails={handleOpenVideoDetails}
                  onOpenAddModal={() => setIsAddVideoModalOpen(true)}
                  onEditVideo={(vid) => { setEditingVideo(vid); setIsEditVideoModalOpen(true); }}
                  onDeleteVideo={handleDeleteVideoProject}
                  stats={systemStats}
                  onCancelJob={handleCancelJob}
                  onCancelAllQueue={handleCancelAllQueue}
                />
              )}

              {activeTab === "video_details" && selectedVideoId && (
                <VideoDetailsView
                  videoId={selectedVideoId}
                  onBack={() => { setActiveTab("videos"); fetchVideos(); fetchStats(); }}
                  onJobCreated={() => { fetchStats(); fetchVideos(); }}
                  onDeleteVideo={handleDeleteVideoProject}
                  onCancelJob={handleCancelJob}
                />
              )}

              {activeTab === "ytd" && (
                <YtdChannelsView
                  channels={ytdChannels}
                  stats={ytdStats}
                  isLoading={isLoadingYtd}
                  onRefresh={() => { fetchYtdChannels(); fetchYtdStats(); }}
                  onOpenAddModal={() => setIsAddChannelModalOpen(true)}
                  onOpenDetails={(chId) => { setSelectedChannelId(chId); setActiveTab("ytd_channel_details"); }}
                  onEditChannel={(ch) => { setEditingChannel(ch); }}
                  onDeleteChannel={handleDeleteChannel}
                  onSyncChannel={handleSyncChannel}
                  onSwitchToDirect={() => setActiveTab("direct")}
                />
              )}

              {activeTab === "ytd_channel_details" && selectedChannelId && (
                <YtdChannelDetailsView
                  channelId={selectedChannelId}
                  onBack={() => { setActiveTab("ytd"); setSelectedChannelId(null); fetchYtdChannels(); }}
                  onDownloadVideo={(video) => setDownloadModalVideo(video)}
                  onDeleteVideo={handleDeleteYtdVideo}
                  onSyncChannel={handleSyncChannel}
                />
              )}

              {activeTab === "direct" && (
                <DirectDownloaderView
                  videos={directVideos}
                  stats={directStats}
                  isLoading={isLoadingDirect}
                  onRefresh={() => { fetchDirectVideos(); fetchDirectStats(); }}
                  onAddVideo={handleAddDirectVideo}
                  onDownloadVideo={handleDownloadDirectVideo}
                  onDeleteVideoFileOnly={handleDeleteDirectVideoFileOnly}
                  onDeleteVideoPermanent={handleDeleteDirectVideoPermanent}
                  onSwitchToChannels={() => { setActiveTab("ytd"); setSelectedChannelId(null); fetchYtdChannels(); }}
                />
              )}
            </div>
          </main>

          {/* Add New Video Modal */}
          {isAddVideoModalOpen && (
            <AddVideoModal
              onClose={() => setIsAddVideoModalOpen(false)}
              onCreated={(createdVid) => {
                setIsAddVideoModalOpen(false);
                fetchVideos();
                fetchStats();
                setSelectedVideoId(createdVid.id);
                setActiveTab("video_details");
              }}
            />
          )}

          {/* Edit Video Modal */}
          {isEditVideoModalOpen && editingVideo && (
            <EditVideoModal
              video={editingVideo}
              onClose={() => { setIsEditVideoModalOpen(false); setEditingVideo(null); }}
              onUpdated={() => {
                setIsEditVideoModalOpen(false);
                setEditingVideo(null);
                fetchVideos();
              }}
            />
          )}

          {/* Add Channel Modal */}
          {isAddChannelModalOpen && (
            <AddChannelModal
              onClose={() => setIsAddChannelModalOpen(false)}
              onCreated={(newCh) => {
                setIsAddChannelModalOpen(false);
                fetchYtdChannels();
                fetchYtdStats();
              }}
            />
          )}

          {/* Edit Channel Modal */}
          {editingChannel && (
            <EditChannelModal
              channel={editingChannel}
              onClose={() => setEditingChannel(null)}
              onUpdated={() => {
                setEditingChannel(null);
                fetchYtdChannels();
              }}
            />
          )}

          {/* Download Video Modal (Full, Splits, Shorts) */}
          {downloadModalVideo && (
            <YtdDownloadModal
              video={downloadModalVideo}
              onClose={() => setDownloadModalVideo(null)}
              onDownloadStarted={() => {
                fetchYtdStats();
              }}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // Dashboard View Component
    // =========================================================================
    function DashboardView({ stats, onRefresh, onOpenVideoDetails, onAddVideo, videosList, onDeleteVideo, onCancelJob, onCancelAllQueue }) {
      const counts = stats?.counts || { total_videos: 0, total_conversions: 0, active_jobs: 0, queued_jobs: 0, processing_jobs: 0, total_languages: 0 };
      const queueSummary = stats?.queue_summary || {
        total_in_queue: counts.queued_jobs || 0,
        total_processing: counts.processing_jobs || 0,
        total_pending: counts.active_jobs || 0,
        estimated_seconds_remaining: 0,
        estimated_time_formatted: counts.estimated_queue_time || "0s",
        estimated_finish_time: null,
        processing_jobs: [],
        queued_jobs: []
      };

      const processingJobs = queueSummary.processing_jobs || [];
      const queuedJobs = queueSummary.queued_jobs || [];
      const hasPending = queueSummary.total_pending > 0;
      const primaryActive = processingJobs.length > 0 ? processingJobs[0] : (queuedJobs.length > 0 ? queuedJobs[0] : null);

      return (
        <div className="space-y-8">
          {/* Current Running Conversion & Queue Status Card */}
          <div className="glass-card rounded-2xl p-6 border border-white/10 relative overflow-hidden">
            {hasPending && primaryActive ? (
              <div>
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                  <div className="flex items-center gap-3">
                    <span className="flex h-3 w-3 relative">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                    </span>
                    <div>
                      <h2 className="text-base font-bold text-white flex items-center gap-2">
                        <span>Active Video Conversion & Queue</span>
                        <span className="text-xs px-2 py-0.5 rounded-full bg-surface-800 text-slate-300 font-mono border border-white/10">
                          {queueSummary.total_pending} {queueSummary.total_pending === 1 ? 'Job' : 'Jobs'} Total
                        </span>
                      </h2>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 flex-wrap">
                    {queueSummary.total_processing > 0 && (
                      <span className="text-xs px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20 font-bold uppercase tracking-wider flex items-center gap-1.5">
                        <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                        <span>{queueSummary.total_processing} Running</span>
                      </span>
                    )}
                    {queueSummary.total_in_queue > 0 && (
                      <span className="text-xs px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-bold uppercase tracking-wider flex items-center gap-1.5">
                        <span>⏳</span>
                        <span>{queueSummary.total_in_queue} in Queue</span>
                      </span>
                    )}
                    {queueSummary.estimated_seconds_remaining > 0 && (
                      <span className="text-xs px-3 py-1 rounded-full bg-gradient-to-r from-brand-600/30 to-indigo-600/30 text-brand-300 border border-brand-500/30 font-bold tracking-wide flex items-center gap-1.5 shadow-sm">
                        <span>⏱ Approx. {queueSummary.estimated_time_formatted} Remaining</span>
                      </span>
                    )}
                    {primaryActive && onCancelJob && (
                      <button
                        type="button"
                        onClick={() => onCancelJob(primaryActive.job_id, primaryActive.part_name || primaryActive.video_title)}
                        className="px-2.5 py-1 rounded-lg bg-red-600 hover:bg-red-500 text-white border border-red-500 text-xs font-bold transition flex items-center gap-1 shadow-sm ml-1"
                        title="Stop this task"
                      >
                        <Icons.Stop />
                        <span>Stop Task</span>
                      </button>
                    )}
                    {queueSummary.total_pending > 1 && onCancelAllQueue && (
                      <button
                        type="button"
                        onClick={onCancelAllQueue}
                        className="px-2.5 py-1 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-300 hover:text-white border border-red-500/30 text-xs font-bold transition flex items-center gap-1"
                        title="Cancel all pending jobs in queue"
                      >
                        <Icons.Close />
                        <span>Cancel All ({queueSummary.total_pending})</span>
                      </button>
                    )}
                    {onAddVideo && (
                      <button
                        type="button"
                        onClick={onAddVideo}
                        className="px-2.5 py-1 rounded-lg bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold transition flex items-center gap-1 shadow-sm ml-1"
                        title="Add second video to queue"
                      >
                        <Icons.Plus />
                        <span>Queue Another Video</span>
                      </button>
                    )}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                  <div className="p-3.5 rounded-xl bg-surface-900 border border-white/5">
                    <div className="text-xs text-gray-400">Current Task</div>
                    <div className="font-bold text-white text-sm truncate mt-0.5" title={primaryActive.display_title || primaryActive.video_title || primaryActive.part_name || "Full Video"}>
                      {primaryActive.video_title ? primaryActive.video_title : (primaryActive.part_name || "Full Video")}
                    </div>
                    <div className="text-[11px] text-slate-400 truncate mt-0.5">
                      {primaryActive.part_name ? `${primaryActive.part_name} • ` : 'Full Video • '}
                      {(primaryActive.target_langs || []).join(', ').toUpperCase()}
                    </div>
                  </div>

                  <div className="p-3.5 rounded-xl bg-surface-900 border border-white/5">
                    <div className="text-xs text-gray-400">Target Languages</div>
                    <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                      {(primaryActive.target_langs || []).map(l => (
                        <span key={l} className="text-xs px-2 py-0.5 rounded bg-surface-800 text-slate-200 border border-white/5 font-semibold">
                          {LANG_MAP[l]?.flag} {LANG_MAP[l]?.name || l}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="p-3.5 rounded-xl bg-surface-900 border border-white/5">
                    <div className="text-xs text-gray-400">Current Task Progress</div>
                    <div className="font-black text-brand-400 text-lg mt-0.5 flex items-center gap-2">
                      <span>{Math.round((primaryActive.progress || 0) * 100)}%</span>
                      {primaryActive.estimated_remaining_formatted && primaryActive.status === "processing" && (
                        <span className="text-xs font-normal text-slate-400 font-mono">
                          (~{primaryActive.estimated_remaining_formatted} left)
                        </span>
                      )}
                    </div>
                  </div>

                  <div className="p-3.5 rounded-xl bg-surface-900 border border-white/5">
                    <div className="text-xs text-gray-400">Total Queue ETA</div>
                    <div className="font-black text-indigo-400 text-lg mt-0.5">
                      ~{queueSummary.estimated_time_formatted}
                    </div>
                    {queueSummary.estimated_finish_time && (
                      <div className="text-[11px] text-slate-400 mt-0.5">
                        Est. Finish: {new Date(queueSummary.estimated_finish_time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </div>
                    )}
                  </div>
                </div>

                {/* Progress bar */}
                <div className="w-full bg-surface-900 rounded-full h-3 overflow-hidden mb-2">
                  <div
                    className="bg-gradient-to-r from-brand-600 via-indigo-500 to-pink-500 h-3 rounded-full transition-all duration-300"
                    style={{ width: `${Math.round((primaryActive.progress || 0) * 100)}%` }}
                  ></div>
                </div>
                <p className="text-xs text-slate-400 flex items-center justify-between">
                  <span>Current Step: <strong className="text-slate-200">{primaryActive.current_step}</strong></span>
                  <span className="text-[11px] text-slate-500">Live 3s polling & WebSocket stream</span>
                </p>

                {/* Queue Backlog List (when jobs are waiting) */}
                {queuedJobs.length > 0 && (
                  <div className="mt-4 pt-4 border-t border-white/5 space-y-2.5">
                    <div className="flex items-center justify-between text-xs">
                      <span className="font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                        <span>⏳</span>
                        <span>Waiting in Queue ({queuedJobs.length} {queuedJobs.length === 1 ? 'task' : 'tasks'})</span>
                      </span>
                      <span className="text-slate-400 font-mono text-[11px]">
                        Sequential worker queue (1 active conversion)
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                      {queuedJobs.map((qJob, qIdx) => (
                        <div key={qJob.job_id || qIdx} className="p-3 rounded-xl bg-surface-900/90 border border-white/5 flex items-center justify-between gap-2.5 hover:border-white/10 transition">
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5">
                              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-surface-800 text-amber-400 font-bold">
                                #{qIdx + 1}
                              </span>
                              <span className="font-bold text-xs text-white truncate" title={qJob.display_title || qJob.video_title || qJob.part_name || "Full Video"}>
                                {qJob.video_title ? qJob.video_title : (qJob.part_name || "Full Video")}
                              </span>
                            </div>
                            <div className="text-[11px] text-slate-400 truncate mt-0.5" title={qJob.part_name ? `${qJob.part_name} • ${(qJob.target_langs || []).join(', ').toUpperCase()}` : `Full Video • ${(qJob.target_langs || []).join(', ').toUpperCase()}`}>
                              {qJob.part_name ? `${qJob.part_name} • ` : 'Full Video • '}
                              {(qJob.target_langs || []).join(', ').toUpperCase()}
                            </div>
                          </div>
                          <div className="text-right shrink-0 flex items-center gap-2">
                            <div>
                              <span className="text-[11px] font-mono text-brand-400 font-bold block">
                                ~{qJob.estimated_duration_formatted || "3m"}
                              </span>
                              <span className="text-[10px] text-slate-500 uppercase font-semibold">
                                Queued
                              </span>
                            </div>
                            {onCancelJob && (
                              <button
                                type="button"
                                onClick={() => onCancelJob(qJob.job_id, qJob.display_title || qJob.part_name || qJob.video_title)}
                                className="p-1.5 rounded-lg bg-surface-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-white/5 transition"
                                title="Cancel and remove from queue"
                              >
                                <Icons.Close />
                              </button>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                    <h2 className="text-base font-bold text-white">Conversion Engine Ready (Idle)</h2>
                  </div>
                  <p className="text-xs text-slate-400">
                    Queue is empty. 0 jobs waiting. The automated dubbing pipeline is idle and ready for video conversion.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={onAddVideo}
                  className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs transition shadow-lg shadow-brand-500/20"
                >
                  Start New Video Conversion
                </button>
              </div>
            )}
          </div>

          {/* Counts Metric Cards */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="glass-card rounded-2xl p-5 border border-white/5">
              <div className="flex items-center justify-between text-slate-400 mb-2">
                <span className="text-xs font-semibold uppercase tracking-wider">Total Videos</span>
                <Icons.Videos />
              </div>
              <div className="text-3xl font-black text-white">{counts.total_videos}</div>
              <div className="text-[11px] text-slate-400 mt-1">Managed projects</div>
            </div>

            <div className="glass-card rounded-2xl p-5 border border-white/5">
              <div className="flex items-center justify-between text-slate-400 mb-2">
                <span className="text-xs font-semibold uppercase tracking-wider">Converted Parts</span>
                <Icons.Play />
              </div>

                <table className="w-full text-left text-xs">

                      <th className="pb-3 pl-2">Title</th>
                      <th className="pb-3">YouTube Link</th>
                      <th className="pb-3">Languages</th>
                      <th className="pb-3">Conversions</th>
                      <th className="pb-3 text-right pr-2">Action</th>
                    </tr>
                  </thead>

                    {videosList.slice(0, 5).map(v => (
                      <tr key={v.id} className="hover:bg-surface-850 transition">
                        <td className="py-3 pl-2 font-bold text-slate-200">
                          {v.title}
                        </td>
                        <td className="py-3">
                          {v.youtube_url ? (
                            <a
                              href={v.youtube_url}
                              target="_blank"

                              <Icons.ExternalLink />

                        <td className="py-3">
                          <div className="flex items-center gap-1">
                            {(v.languages || []).map(code => (
                              <span
                                key={code}
                                className="px-2 py-0.5 rounded bg-surface-800 text-slate-300 font-semibold border border-white/5 text-[11px]"

                                {LANG_MAP[code]?.flag} {code.toUpperCase()}

                        <td className="py-3 text-slate-400">

                    ))}
                  </tbody>
                </table>

            )}
          </div>
        </div>
      );

    // =========================================================================
    // Videos List View Component
    // =========================================================================
    function VideosListView({ videos = [], isLoading, onRefresh, onOpenDetails, onOpenAddModal, onEditVideo, onDeleteVideo, stats, onCancelJob, onCancelAllQueue }) {

      const queuedJobs = queueSummary.queued_jobs || [];

          {hasPending && primaryActive && (
            <div className="glass-card rounded-2xl p-6 border border-brand-500/30 relative overflow-hidden bg-gradient-to-r from-surface-900 via-surface-850 to-indigo-950/30 shadow-xl shadow-brand-500/10">

                <div className="flex items-center gap-3">

                  </span>
                  <div>
                    <h2 className="text-base font-bold text-white flex items-center gap-2">
                      <span>Conversion Queue Active</span>
                      <span className="text-xs px-2 py-0.5 rounded-full bg-surface-800 text-slate-300 font-mono border border-white/10">
                        {queueSummary.total_pending} {queueSummary.total_pending === 1 ? 'Job' : 'Jobs'} in Pipeline

                  </div>
                </div>

                <div className="flex items-center gap-2 flex-wrap">
                  {queueSummary.total_processing > 0 && (
                    <span className="text-xs px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20 font-bold uppercase tracking-wider flex items-center gap-1.5">
                      <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                      <span>1 Converting</span>

                    <span className="text-xs px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-bold uppercase tracking-wider flex items-center gap-1.5">
                      <span>⏳</span>
                      <span>{queueSummary.total_in_queue} in Queue</span>

                  )}
                  {queueSummary.estimated_seconds_remaining > 0 && (
                    <span className="text-xs px-3 py-1 rounded-full bg-gradient-to-r from-brand-600/30 to-indigo-600/30 text-brand-300 border border-brand-500/30 font-bold tracking-wide flex items-center gap-1.5 shadow-sm">
                      <span>⏱ Approx. {queueSummary.estimated_time_formatted} Left</span>
                    </span>
                  )}
                  {primaryActive && onCancelJob && (
                    <button
                      type="button"
                      onClick={() => onCancelJob(primaryActive.job_id, primaryActive.display_title || primaryActive.part_name || primaryActive.video_title)}
                      className="px-2.5 py-1 rounded-lg bg-red-600 hover:bg-red-500 text-white border border-red-500 text-xs font-bold transition flex items-center gap-1 shadow-sm ml-1"
                      title="Stop current conversion"
                    >
                      <Icons.Stop />
                      <span>Stop Task</span>
                    </button>
                  )}
                  {queueSummary.total_pending > 1 && onCancelAllQueue && (
                    <button
                      type="button"
                      onClick={onCancelAllQueue}
                      className="px-2.5 py-1 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-300 hover:text-white border border-red-500/30 text-xs font-bold transition flex items-center gap-1"
                      title="Cancel all pending jobs in queue"
                    >
                      <Icons.Close />
                      <span>Cancel All ({queueSummary.total_pending})</span>
                    </button>
                  )}
                </div>
              </div>

              {/* Progress bar */}
              <div className="w-full bg-surface-900 rounded-full h-2.5 overflow-hidden mb-2">
                <div
                  className="bg-gradient-to-r from-brand-600 via-indigo-500 to-pink-500 h-2.5 rounded-full transition-all duration-300"
                  style={{ width: `${Math.round((primaryActive.progress || 0.05) * 100)}%` }}
                ></div>
              </div>
              <p className="text-xs text-slate-300 flex items-center justify-between">
                <span>
                  Converting: <strong className="text-white">{primaryActive.video_title ? primaryActive.video_title : (primaryActive.part_name || "Full Video")}</strong>
                  {primaryActive.part_name && <span className="text-slate-400"> ({primaryActive.part_name})</span>}
                  <span className="text-brand-400 font-mono ml-2 font-bold">{Math.round((primaryActive.progress || 0) * 100)}%</span>
                  <span className="text-slate-400 ml-2">— {primaryActive.current_step}</span>
                </span>
                <span className="text-slate-400 font-mono text-[11px]">Sequential Queue (1 active worker)</span>

          {/* Header Controls */}
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
            <div className="flex flex-1 items-center gap-3">

                type="text"
                placeholder="Search videos by title or URL..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full max-w-xs px-4 py-2 rounded-xl bg-surface-900 border border-slate-700 text-sm text-slate-200 placeholder-slate-500 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none"
              />

              <select
                value={selectedLangFilter}
                onChange={(e) => setSelectedLangFilter(e.target.value)}
                className="px-3 py-2 rounded-xl bg-surface-900 border border-slate-700 text-sm text-slate-300 focus:border-brand-500 outline-none"
              >
                <option value="all">All Languages</option>
                {LANGUAGES.map(l => (
                  <option key={l.code} value={l.code}>
                    {l.flag} {l.name}
                  </option>
                ))}

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={onRefresh}
                className="p-2 rounded-xl bg-surface-900 hover:bg-surface-850 text-slate-300 border border-slate-800 transition"

              <button

                className="flex items-center gap-2 px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm transition shadow-lg shadow-brand-500/25"
              >
                <Icons.Plus />
                <span>Add New Video</span>
              </button>
            </div>
          </div>

          {/* Videos Table */}
          <div className="glass-card rounded-2xl overflow-hidden border border-white/10">
            {isLoading ? (
              <div className="text-center py-12 text-slate-400">Loading videos library...</div>

              <div className="text-center py-16">
                <div className="text-3xl mb-2">🎬</div>
                <h3 className="text-base font-bold text-white mb-1">No videos found</h3>
                <p className="text-xs text-slate-400 mb-4">
                  {searchQuery ? "Try refining your search query." : "Create your first video project to begin dubbing."}
